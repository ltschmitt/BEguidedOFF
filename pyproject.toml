[build-system]
requires = ["setuptools>=82.0.1,<83", "torch>=2.5.1,<3", "numpy>=2.4.6,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "beguidedoff"
version = "0.1.0"
description = "GPU-Accelerated Off-Target Base Editing Seeker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lukas Schmitt", email = "lukas_theo.schmitt@tu-dresden.de"}
]
keywords = ["CRISPR", "base-editing", "off-target", "GPU", "CUDA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
beguidedoff = "beguidedoff.cli:main"

[tool.pixi.workspace]
channels = ["pytorch", "conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
numpy = ">=2.4.6,<3"
pandas = ">=3.0.3,<4"
pysam = ">=0.24.0,<0.25"
pytest = ">=9.0.3,<10"
pytorch-cuda = ">=12.4,<13"
pytorch = ">=2.5.1,<3"
setuptools = ">=82.0.1,<83"
numba = ">=0.65.1,<0.66"

[tool.pixi.tasks]
beguidedoff = "python -m beguidedoff.cli"
