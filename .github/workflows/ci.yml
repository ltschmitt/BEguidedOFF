name: CI

# Test suite and the pixi source-package recipe.
#
# The test job builds the native FM-index binding in place first (the repo
# does not ship built artifacts) so the fast-mode tests actually run instead
# of skipping; the GPU (extensive) tests skip automatically because GitHub
# runners have no CUDA device. The recipe job builds the conda package the
# way external consumers do and smoke-tests the entry point and the binding.
#
# pixi is pinned to the version the recipe was verified with; the
# `pixi-build` preview feature evolves, so bump deliberately.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.81.0
          cache: true
      - name: Build the FM-index binding in place
        run: pixi run python setup.py build_ext --inplace
      - run: pixi run test -q

  recipe:
    name: Pixi recipe smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Build conda package
        run: pixi build -o dist
      - name: Install into a scratch consumer workspace
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          cat > pyproject.toml <<'EOF'
          [project]
          name = "smoke-consumer"
          version = "0.0.1"
          requires-python = ">=3.10"

          [tool.pixi.workspace]
          channels = ["conda-forge", "bioconda"]
          platforms = ["linux-64"]
          preview = ["pixi-build"]
          EOF
          pixi add --path "$GITHUB_WORKSPACE" beguidedoff
      - name: Smoke-test entry point and FM-index binding
        run: |
          cd /tmp/consumer
          pixi run beguidedoff --help
          pixi run python -c "import beguidedoff._fmindex; print('fm-index binding imports')"
